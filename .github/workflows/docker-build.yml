name: Build Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t driftguard:latest .

      - name: Save Docker image as artifact
        run: docker save driftguard:latest | gzip > driftguard.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-image
          path: driftguard.tar.gz
