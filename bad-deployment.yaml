apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: driftguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: test-app
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: DB_PASSWORD
              value: "SuperSecret123"
            - name: API_KEY
              value: "sk-fake-hardcoded-key-abc123"
